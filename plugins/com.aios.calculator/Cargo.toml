[workspace]

[package]
name = "aios-plugin-calculator"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
aios-plugin-sdk = { path = "../../crates/aios-plugin-sdk", features = ["guest"] }
aios-plugins = { path = "../../crates/aios-plugins", default-features = false }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true

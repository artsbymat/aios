[plugin]
id = "com.aios.palette-grid"
name = "Palette Swatches"
version = "0.1.0"
description = "Reference Grid & Form external WASM plugin showcasing mineral color swatches."
author = "AIOS"
min_aios_version = "0.1.0"
icon = "icon.svg"
entry = "plugin.wasm"

[capabilities]
clipboard_write = true
clipboard_read = false
http_hosts = []
fs_read = []
secrets = false

[[preferences]]
name = "default_columns"
title = "Grid Columns"
description = "Number of columns (1..8) for the swatch grid"
kind = "textfield"
default = "4"
required = false

[[commands]]
id = "swatches"
title = "Browse Palette Swatches"
subtitle = "Palette Swatches (WASM Grid)"
mode = "view"
default_view = "grid"
keywords = ["color", "swatch", "grid", "palette", "wasm"]

[[commands]]
id = "new-swatch"
title = "Create Custom Swatch"
subtitle = "Palette Swatches (WASM Form)"
mode = "view"
default_view = "form"
keywords = ["color", "form", "create", "swatch"]

name: Publish Plugin Registry Index

on:
  push:
    branches: [main]
    paths:
      - "registry/plugins/*.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libsqlite3-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate static index.json
        run: |
          mkdir -p _site
          cargo run -p aios-app -- plugin registry-build registry --out _site/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

[package]
name = "aios-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["host"]
host = ["aios-core/host", "dep:tracing", "dep:ureq"]

[dependencies]
aios-core = { workspace = true, default-features = false }
aios-plugin-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

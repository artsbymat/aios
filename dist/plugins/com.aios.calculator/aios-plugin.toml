[plugin]
id = "com.aios.calculator"
name = "Calculator & Converter"
version = "0.1.0"
description = "Inline math, hex/bin/octal, unit, volume, CSS, date/timezone, and cached offline-first currency converter."
author = "AIOS"
min_aios_version = "0.1.0"
icon = "icon.svg"
entry = "plugin.wasm"

[capabilities]
clipboard_write = true
clipboard_read = false
http_hosts = []
fs_read = []
secrets = false

[inline_trigger]
prefixes = ["="]
match_numeric_expressions = true
leading_chars = ["$", "€", "£", "¥", "(", "[", "-", "+", "π"]
leading_keywords = [
  "today",
  "tomorrow",
  "yesterday",
  "now",
  "sqrt(",
  "cbrt(",
  "sin(",
  "cos(",
  "tan(",
  "asin(",
  "acos(",
  "atan(",
  "log(",
  "log10(",
  "log2(",
  "ln(",
  "exp(",
  "abs(",
  "pow(",
  "min(",
  "max(",
  "round(",
  "floor(",
  "ceil(",
]

[[preferences]]
name = "base_font_px"
title = "CSS Base Font Size (px)"
description = "Root font size used for px <-> rem/em conversions (default: 16)."
kind = "textfield"
default = "16"
required = false

[[preferences]]
name = "decimal_places"
title = "Max Decimal Places"
description = "Maximum decimal precision for floating-point results (0..12, default: 6)."
kind = "textfield"
default = "6"
required = false

[[preferences]]
name = "default_currency"
title = "Default Currency"
description = "Target currency when converting bare symbol amounts like $50 (default: IDR)."
kind = "textfield"
default = "IDR"
required = false

[[preferences]]
name = "currency_refresh_interval"
title = "Exchange Rate Auto-Refresh"
description = "Offline-first cache TTL before background refresh (off, 6h, 12h, 24h, 3d, 7d; default: 24h)."
kind = "textfield"
default = "24h"
required = false

[[commands]]
id = "calculator"
title = "Calculator & Converter"
subtitle = "Math, bases, units, volume, date/timezone & cached currency"
mode = "view"
default_view = "list"
keywords = [
  "calc",
  "calculator",
  "math",
  "convert",
  "unit",
  "volume",
  "currency",
  "hex",
  "bin",
  "timezone",
  "date",
]
